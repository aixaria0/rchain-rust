name: RC-B original-source scheduler matrix
on:
  push:
    branches: [verify/n564-rcb-modes-20261111, verify/n564-trace-historical-20261111]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pin original incident source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p n564-rcb-logs
          cp spec/audit/evidence/n564-rcb-modes-20261111/omega_rcb_modes.rs n564-rcb-logs/
          git fetch --no-tags --depth=1 https://github.com/rhovision-org/rholo.git 0a1e02362a7c34e474e068ffd47469c8d4be707a
          git checkout --detach 0a1e02362a7c34e474e068ffd47469c8d4be707a
          test "$(git rev-parse HEAD)" = 0a1e02362a7c34e474e068ffd47469c8d4be707a
          cp n564-rcb-logs/omega_rcb_modes.rs casper/tests/omega_rcb_modes.rs
      - name: Pinned Rust compiler
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustc +1.95.0 --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - name: Checksum-pinned protoc
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 60 https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip -o /tmp/protoc.zip
          python3 - <<'PY'
          import pathlib,hashlib,zipfile,os
          p=pathlib.Path('/tmp/protoc.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="3a4c1e5f2516c639d3079b1586e703fc7bcfa2136d58bda24d1d54f949c315e8"
          with zipfile.ZipFile(p) as z: z.extractall('/tmp/omega-protoc')
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("PROTOC=/tmp/omega-protoc/bin/protoc\nPROTOC_INCLUDE=/tmp/omega-protoc/include\n")
          PY
          chmod +x /tmp/omega-protoc/bin/protoc
      - name: M21 trace integrity on original incident source
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked -p rchain-casper --test omega_rcb_modes omega_m21 -- --nocapture --test-threads=1 2>&1 | tee n564-rcb-logs/M21-historical.log
      - name: Run M09-M11 strictly on original source
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked -p rchain-casper --test omega_rcb_modes omega_m09 -- --nocapture --test-threads=1 2>&1 | tee n564-rcb-logs/M09-M10.log
          # The existing M11 test is a negative control on the historical source:
          # its OMEGA_UNSAFE_RELAXED_BLOCK_ACCEPTED panic is the expected finding.
          set +e
          cargo +1.95.0 test --locked -p rchain-casper --test omega_rcb_modes omega_m11 -- --nocapture --test-threads=1 > n564-rcb-logs/M11.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "M11 unexpected success"; exit 1; fi
          grep -q OMEGA_UNSAFE_RELAXED_BLOCK_ACCEPTED n564-rcb-logs/M11.log
          echo "M11 expected unsafe historical mode observed"
          git diff --exit-code -- casper/src rholang/src rspace/src
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n564-rcb-original-source-mode-matrix
          path: n564-rcb-logs/
          retention-days: 14
