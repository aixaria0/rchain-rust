name: N576 missing-verdict-body regression
on:
  push:
    branches: [verify/c357-binary-20261113]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
defaults:
  run:
    shell: bash
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Exact test source
        run: |
          git fetch origin 94b97cd66fd7624fc79c2896414550ecfb42ff8c
          git worktree add --detach /tmp/c357-source 94b97cd66fd7624fc79c2896414550ecfb42ff8c
          mkdir receipts
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          sudo tools/ci-apt-install.sh protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: /tmp/c357-source
          shared-key: c357-binary-20261113
          cache-on-failure: true
      - name: Green regression and module suite
        working-directory: /tmp/c357-source
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all --check
          cargo +1.95.0 test --locked -p rchain-casper --lib block_disposition::tests -- --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/receipts/green.log"
      - name: Single-variable red control
        working-directory: /tmp/c357-source
        run: |
          set -euo pipefail
          cp casper/src/block_disposition.rs "$GITHUB_WORKSPACE/receipts/corrected.rs"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("casper/src/block_disposition.rs")
          s=p.read_text()
          start=s.index("            // Without the body we cannot tell")
          end=s.index("\n        };\n        if block.sender == *own_key",start)
          s=s[:start]+"            continue;"+s[end:]
          p.write_text(s)
          PY
          set +e
          cargo +1.95.0 test --locked -p rchain-casper --lib an_equivocation_verdict_without_its_body_fails_closed -- --test-threads=1 > "$GITHUB_WORKSPACE/receipts/red.log" 2>&1
          result=$?
          set -e
          cp "$GITHUB_WORKSPACE/receipts/corrected.rs" casper/src/block_disposition.rs
          test "$result" -ne 0
          grep -q 'missing offence history must not return a clean key: None' "$GITHUB_WORKSPACE/receipts/red.log"
          cargo +1.95.0 test --locked -p rchain-casper --lib an_equivocation_verdict_without_its_body_fails_closed -- --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/receipts/restored.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: n576-missing-body-regression
          path: receipts/
          if-no-files-found: error
