name: Own-key halt parallel regression
on:
  push:
    branches: [verify/c357-binary-20261113]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
defaults:
  run:
    shell: bash
jobs:
  parallel:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin source and toolchain
        run: |
          git fetch origin bf0592aca8a9cc3a1d543642955cc81912f7748c
          git worktree add --detach /tmp/c357-source bf0592aca8a9cc3a1d543642955cc81912f7748c
          mkdir receipts
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          sudo tools/ci-apt-install.sh protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: /tmp/c357-source
          shared-key: c357-binary-20261113
          cache-on-failure: true
      - name: Full Casper library and repeated parallel controls
        working-directory: /tmp/c357-source
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all --check
          cargo +1.95.0 test --locked -p rchain-casper --lib -- --test-threads=8 2>&1 | tee "$GITHUB_WORKSPACE/receipts/full.log"
          for i in $(seq 1 40); do
            cargo +1.95.0 test --locked -p rchain-casper --lib equivocation_verdict -- --test-threads=8 > "$GITHUB_WORKSPACE/receipts/parallel-$i.log" 2>&1
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: own-key-parallel-regression
          path: receipts/
          if-no-files-found: error
