name: N457 real-history recovery from stopped validator state

on:
  push:
    branches:
      - validation/n457-live-join-runner-20261028
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n457-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stored-replay:
    name: Isolated source-pinned restart on mature chain
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Record resources
        run: |
          set -euo pipefail
          uname -a
          free -m
          df -h /
      - name: Retrieve exact-source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p bin
          gh run download 40754851864 --repo rhovision-org/rholo --name rnode-x86_64-unknown-linux-musl --dir bin
          (cd bin && sha256sum -c rnode.sha256)
          chmod 700 bin/rnode
          bin/rnode --version | tee source-version.txt
          grep -F 'd1af45d1db3f5fe2fa6047ad6c8a72b654d041df' source-version.txt
      - name: Fetch draft keyless stopped-validator store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p fixture stored-real-testnet
          gh release download n457-keyless-fixture-20261028 --repo aixaria0/rchain-rust --pattern d-validator-public-state-only.tar.gz --dir fixture
          printf 'd00c0b3f5e66fb70d8abfc35439a79ea85ee9ce1211691dde0b0e0f8802d7cb1  fixture/d-validator-public-state-only.tar.gz\n' | sha256sum --check
          tar -tzf fixture/d-validator-public-state-only.tar.gz | tee snapshot-manifest.txt
          if grep -E 'node[.]key|node[.]certificate|validator[.]key|deployer|[.]pem$' snapshot-manifest.txt; then echo 'PRIVATE_IDENTITY_IN_FIXTURE'; exit 2; fi
          tar -xzf fixture/d-validator-public-state-only.tar.gz -C stored-real-testnet
          du -sh stored-real-testnet
      - name: Run independent stored-state replay and restart
        run: |
          set -euo pipefail
          python3 tools/n457_stored_history_runner.py
      - name: Save execution and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: n457-stored-state-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            source-version.txt
            snapshot-manifest.txt
            stored-replay.json
            stored-replay.log
            stored-restart.json
            stored-restart.log
            stored-error.txt
