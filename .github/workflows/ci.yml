name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Formatting and lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Existing port debt is explicit so every other rustc or Clippy warning is fatal.
      # Remove an allowance as soon as its last occurrence is fixed.
      #
      # `-A dead-code` was the list's first entry and is **gone** (2026-09-25): its last two
      # occurrences were a pairing helper in `casper/src/genesis/rgov.rs`'s test module and a block
      # fixture in `casper/src/reporting.rs`'s, neither called by any test — so they were also the
      # only two lines in the tree that no test could ever cover, and deleting them removed them from
      # the coverage denominator as well. Verified with the command below minus this flag.
      #
      # **Which entries are correctness-critical, and where they fire** (verified 2026-09-28 by
      # deleting each in turn and reading Clippy's output, not by grepping). `await-holding-lock`,
      # `bad-bit-mask` and `if-same-then-else` fire **only in `#[cfg(test)]` and `tests/` code**
      # (block-storage's and rholang's lib-tests). That is what this file has always said, and the
      # note is here because the September 2026 audit read the three as "no locatable site,
      # indistinguishable from stale allowances" — a search of *production* sources does not reach
      # test modules, which is where the sites are. The lesson is the audit's, not the list's.
      #
      # `-A clippy::non-canonical-partial-ord-impl` is **gone** (2026-09-28). Its last occurrence was
      # `AlwaysEqual`'s hand-written `partial_cmp` in `models/src/ast.rs`, now spelled
      # `Some(self.cmp(other))` — behaviourally identical, since both answer `Equal`, but canonical.
      # Verified with the command below minus this flag.
      #
      # `await-holding-lock`'s two **production** sites are also gone: `node/src/effects/repl_client.rs`
      # now clones the client out of the mutex rather than holding the guard across the tonic await.
      # The entry stays for the test-module sites above.
      CLIPPY_DEBT: >-
        -A clippy::await-holding-lock
        -A clippy::bad-bit-mask
        -A clippy::bool-comparison
        -A clippy::clone-on-copy
        -A clippy::cloned-ref-to-slice-refs
        -A clippy::collapsible-str-replace
        -A clippy::default-constructed-unit-structs
        -A clippy::derivable-impls
        -A clippy::doc-lazy-continuation
        -A clippy::enum-variant-names
        -A clippy::explicit-auto-deref
        -A clippy::identity-op
        -A clippy::if-same-then-else
        -A clippy::io-other-error
        -A clippy::items-after-test-module
        -A clippy::large-enum-variant
        -A clippy::manual-div-ceil
        -A clippy::manual-is-multiple-of
        -A clippy::map-identity
        -A clippy::module-inception
        -A clippy::needless-range-loop
        -A clippy::needless-borrow
        -A clippy::needless-return
        -A clippy::explicit-counter-loop
        -A clippy::new-ret-no-self
        -A clippy::new-without-default
        -A clippy::redundant-closure
        -A clippy::result-large-err
        -A clippy::should-implement-trait
        -A clippy::too-many-arguments
        -A clippy::type-complexity
        -A clippy::unnecessary-lazy-evaluations
        -A clippy::unnecessary-cast
        -A clippy::unnecessary-map-or
        -A clippy::unnecessary-sort-by
        -A clippy::unwrap-or-default
        -A clippy::while-let-loop
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add --toolchain 1.95.0 rustfmt clippy

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y protobuf-compiler libprotobuf-dev

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings $CLIPPY_DEBT

      - name: Bench targets compile
        # `make bench-smoke`: **builds and links** every Criterion target in `rspace-bench` and runs
        # none of them. The clippy step above already *type-checks* them (`--all-targets` includes
        # benches), so what this adds is the build and link — the part a type-check cannot see — and it
        # is here because the benchmarks are otherwise only exercised by `make bench-scheduler`, which
        # peaks at ~6.5 GiB and is deliberately not a CI job (AUDIT C107).
        run: cargo bench -p rspace-bench --no-run

  test:
    name: Tests and the node's static gates
    runs-on: ubuntu-24.04
    # 45 minutes is the suite plus the two static gates with headroom for a cold cache.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$(cat rust-toolchain.toml | grep channel | cut -d'"' -f2)" --profile minimal
          rustup component add rustfmt clippy

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y protobuf-compiler libprotobuf-dev

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Audit status
        # **First, before any gate.** The status is the answer to "what is left"; a run that prints a
        # wall of `ok` without it answers a question nobody had. `--quiet` keeps it to one line, and it
        # is also a check: it refuses a check-off that disagrees with the authored TSV.
        run: tools/audit-status.sh --quiet

      - name: Type-system gate
        # The four **hard** classes only -- production `unwrap()`/`panic!`/`unsafe`, a silent fallible
        # conversion, a refinement surrendering its invariant. This is the one gate here that catches a
        # defect in the *node*, and it costs ~30 s. The counted classes were ratcheted against a
        # baseline file until 2026-09-27 and are not enforced any more: a number that fails the build
        # whenever it moves is a build step that has to be edited, not a check.
        run: tools/audit-type-system.sh

      - name: Vendored-source gate
        # The blessed contracts under `casper/src/genesis/resources/` are the **oracle's own source
        # text**, vendored and compiled in with `include_str!`, so an edit to one is a specification
        # change wearing a comment's clothes. Seconds, and it guards the spec rather than a document
        # about the spec.
        run: tools/audit-vendored-sources.sh

      - name: Test
        run: cargo test --workspace --all-features

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit Rust dependencies
        # `check` and not `check advisories` (AUDIT F-12). The narrower command ran only the
        # RustSec advisory check, which left every other policy in `deny.toml` — the copyleft
        # allow-list most of all — as dead letter: a licence, a banned crate or an unexpected
        # source could arrive unnoticed. Running the whole policy immediately found `foldhash`'s
        # Zlib, which had been reaching the tree unlisted; that is now allowed by name, with its
        # reason, in `deny.toml`.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
