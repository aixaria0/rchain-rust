# Test + audit gate + coverage gate.
#
# Runs the full test suite, the type-system audit gate, the coverage-register gate, and
# cargo-llvm-cov with a minimum line-coverage threshold. The threshold is raised only after
# measuring, to two points below the measured value -- never to a number the plan hopes to reach.

name: test & coverage

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  # Least privilege, stated rather than defaulted (AUDIT C137). The default token is
  # read/write in older repositories and the default is not a decision anyone made here.
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    # A ceiling, because this job had none: an unbounded job is one that can hold a runner for hours
    # without anyone being told. The heavy measurement is the nightly's now, and 45 minutes is the
    # suite plus the two static gates with headroom for a cold cache.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Type-system audit gate
        run: tools/audit-type-system.sh

      - name: Test-coverage register gate
        # `spec/TEST-COVERAGE.md` must match the tree: no overstated counts, no named test that does
        # not exist, no phantom `#[ignore]` section, and no source file that is neither tested nor
        # an exemption row with a reason class. Hard mode: every check fails the build. (The flag
        # this used to carry — `--deferred-ok` — was dropped when the census sweep closed, so that
        # moment is a visible diff rather than somebody's memory.)
        run: tools/audit-test-register.sh

      - name: Vendored-source gate
        # The blessed contracts under `casper/src/genesis/resources/` are the **oracle's own source
        # text**, vendored and compiled in with `include_str!`, so an edit to one is a specification
        # change wearing a comment's clothes: the contract still parses, still installs, still passes
        # its tests, and nothing records that the text is no longer the oracle's. Two such edits had
        # already happened and both were found by hand — by diffing the tree against `legacy/` while
        # reading for something else — which is why this is a script.
        #
        # It lives here rather than in `check-lean` because it is a static audit of the tree and not a
        # build of the specification. Until now it was invoked only by the `Makefile`'s
        # `check-register` target, and **CI never runs the Makefile** — so the gate existed, passed,
        # and could not fail anyone. `tools/audit-instruments.sh` reported exactly that, and its
        # check is the reason this step is here rather than in a note.
        run: tools/audit-vendored-sources.sh

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler


      - name: Test
        # The suite, **uninstrumented**. `cargo llvm-cov` is how coverage is *measured*, and it moves
        # the whole workspace through a codegen profile of its own to do it — so running it per push
        # meant every push paid for a full instrumented rebuild to learn what a plain `cargo test`
        # already answers. Correctness is a per-push gate; coverage is a nightly measurement, and the
        # floors it enforces live with the nightly job.
        run: cargo test --workspace --all-features
