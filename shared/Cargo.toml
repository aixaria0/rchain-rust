[package]
name = "rchain-shared"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Faithful and hardened Rust port of the RChain shared module (Base16, Serialize, DagOps, store traits)."

[features]
default = ["tokio"]
tokio = ["dep:tokio", "dep:async-trait", "dep:lz4_flex"]
lmdb = ["tokio", "dep:lmdb-rkv"]

[dependencies]
tokio = { version = "1", features = ["sync", "rt"], optional = true }
async-trait = { version = "0.1", optional = true }
lz4_flex = { version = "0.14", optional = true }
lmdb-rkv = { version = "0.14", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# `std::time::{Instant, SystemTime}` compile for `wasm32-unknown-unknown` but panic at runtime — the
# target has no clock in `std`. `web-time` provides the same three items backed by the host's
# `performance.now`/`Date`, so the modules that stamp time (`time`, `debug`, `log`, `rate_limiter`,
# `stopwatch`) alias them per target instead of calling `std` directly (issue #98,
# `candidate:host-supplied-clock`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
