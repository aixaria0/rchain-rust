[package]
name = "rchain-models"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Faithful and hardened Rust port of the RChain models module (rholang AST + canonicalizing sorter)."

[dependencies]
num-bigint = { version = "0.5", features = ["serde"] }
num-traits = "0.2"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
rchain-crypto = { path = "../crypto" }
rchain-shared = { path = "../shared" }

# **wasm32 has no gRPC stack (issue #98).** `tonic` depends on `hyper` → `h2` → `mio`, none of which
# compile for `wasm32-unknown-unknown`, and the reducer needs only the `prost` *messages* (the `Par`
# wire types), never a service. `build.rs` therefore emits no clients/servers for the wasm target, and
# these two are host-only. tonic 0.14 split its prost support out: the generated services reference
# `tonic_prost::ProstCodec`, hence both crates move together.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
prost-build = "0.14"
tonic-prost-build = "0.14"

[dev-dependencies]
serde_json = "1"
# The property sweep (Laws 1/2/6). Already in `Cargo.lock` — a dev-dependency addition, not a new
# external dependency.
proptest = "1"
