# `cargo-deny` configuration — what CI's `dependencies` job checks.
#
# `cargo deny check` failed on **all** four checks' worth of noise before this file had a `[licenses]`
# section: with no `allow` list, the default is empty, so every dependency was rejected — including
# plain `MIT OR Apache-2.0` ones. The policy below is the fix, and it is deliberately a *policy*: an
# empty allow-list is not a policy, and neither is "allow everything".

[advisories]
# `hocon` depends on `java-properties`, which currently depends on the abandoned
# `encoding` crate. There is no safe upgrade available upstream; keep this exception
# visible and scoped to the specific RustSec advisory while the dependency is replaced.
ignore = [
    "RUSTSEC-2021-0153",
    # RUSTSEC-2026-0381 (the distrusted emSign root) is fixed in `webpki-roots` 1.0.10, which the lockfile
    # holds. The advisory still matches `webpki-roots` 0.26.11 by version range, but 0.26.11 is a
    # semver-trick shim that re-exports 1.x (its own `lib.rs` says so), so it carries the patched roots.
    # A crate-scoped ignore does not silence a vulnerability in this cargo-deny, so the ID is ignored
    # here and the patched floor is kept by the `[bans]` entry on `webpki-roots` below 1.0.10. Drop both
    # when `tokio-tungstenite` depends on `webpki-roots` 1.x directly.
    "RUSTSEC-2026-0381",
]

[licenses]
# Permissive, per dependency — deliberately **not** including any copyleft license. Add an entry only
# with a reason: this list is what stops a GPL/AGPL dependency from arriving unnoticed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    # `foldhash` (a `hashbrown` dependency) is Zlib — permissive, OSI-approved, no copyleft. It was
    # reaching the tree unlisted for as long as this check was not actually run: CI invoked
    # `cargo deny check advisories`, so the allow-list below was dead letter and nothing noticed
    # (AUDIT F-12). Adding it, rather than the check, is the fix the file's own policy prescribes.
    "Zlib",
    # This repository is AGPL-3.0-only (see LICENSE), and cargo-deny checks *workspace* crates like
    # any other unless their manifests say `publish = false` — which ours do not. So our own license
    # has to be listed here. It is the one entry above that is not a dependency-license policy, and it
    # can be dropped (leaving `private.ignore` to do the work) by marking the members
    # `publish = false`, which is accurate for a workspace that is an application.
    "AGPL-3.0-only",
]
# An `OR` expression is satisfied by any one allowed license, so `r-efi`'s
# `MIT OR Apache-2.0 OR LGPL-2.1-or-later` (a UEFI shim `getrandom` pulls in, never linked on the
# Linux/macOS targets this project builds) passes on MIT — no LGPL exception is needed or granted.
#
# Our own crates are AGPL-3.0-only, like the repository's LICENSE. The allow-list is about the code we
# *depend on*: keeping `private.ignore` on means our license never has to be added to it.
[licenses.private]
ignore = true

[bans]
# The floor that lets `[advisories]` ignore RUSTSEC-2026-0381 by ID: the 1.x copy of `webpki-roots`
# below 1.0.10 still ships the distrusted emSign root, so it is refused here rather than by the
# advisory (see the ignore entry for why the advisory cannot be left on).
deny = [
    { name = "webpki-roots", version = ">=1.0.0, <1.0.10", reason = "RUSTSEC-2026-0381: 1.0.10 removes the distrusted emSign root" },
]
