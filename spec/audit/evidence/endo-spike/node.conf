# The node the Endo transcript dials (issue #249, clause 4).
#
# Run it with:
#
#   mkdir -p $DATA/genesis
#   printf '04f700a4…66b5c4 100\n'  > $DATA/genesis/bonds.txt     # the validator's public key, see below
#   printf '11112VYAt8rUGNRRZX3eJdgagaAhtWTK8Js7F7X5iqddMVqyDTtYau,1000000000000\n' \
#                                 > $DATA/genesis/wallets.txt    # the deployer's REV account
#   target/debug/rnode run -d $DATA
#
# `-d $DATA` is what `storage.data-dir` and every genesis path interpolate from, so nothing here is
# machine-specific. This file goes in `$DATA/rnode.conf`, which is where `run` looks by default.
#
# **Why a validator at all, for a capability demo.** A bridged call becomes a *signed deploy*, and a
# deploy only takes effect in a block — so the node has to be one that proposes. `dev-mode` + a
# bonded validator + `propose-on-deploy` is the smallest configuration that lands a deploy and lets
# the reply channel carry the value back to the CapTP promise. The keys are the same throwaway pair
# the integration tests use (`node/tests/common/mod.rs`): `dev.deployer-private-key` is what the
# bridge signs with, so its REV account is the wallet the deploys spend from.

standalone = true
dev-mode = true
# Propose as soon as a deploy is accepted: the bridge delivers a deploy and then waits for its reply,
# so nothing else is around to drive a block.
propose-on-deploy = true

protocol-server {
  host = "127.0.0.1"
  port = 40555
  no-upnp = true
}

api-server {
  host = "127.0.0.1"
  port-grpc-external = 40411
  port-grpc-internal = 40412
  port-http = 40413
  port-admin-http = 40415
  # The OCapN listener the transcript dials. `tcp-testing-only`: plain TCP, no encryption, no
  # authentication — which is what `@endo/ocapn`'s netlayer of the same name speaks, and why this is
  # a loopback-only demo.
  ocapn-listen = "127.0.0.1:22050"
}

casper {
  validator-private-key = "a68a6e6cca30f81bd24a719f3145d20e8424bd7b396309b0708a16c7d8000b76"
}

dev {
  # The key the bridge signs bridged deploys with. Its REV address is what `wallets.txt` funds.
  deployer-private-key = "a68a6e6cca30f81bd24a719f3145d20e8424bd7b396309b0708a16c7d8000b76"
}
