# The node the Endo **websocket** transcript dials.
#
# `node.conf`'s twin, with the websocket listener instead of `tcp-testing-only` — the difference being
# that this transport authenticates (the node signs an in-band challenge with the key its identity
# file holds) where `tcp-testing-only` does not authenticate at all.
#
#   mkdir -p $DATA/genesis
#   printf '11112VYAt8rUGNRRZX3eJdgagaAhtWTK8Js7F7X5iqddMVqyDTtYau,1000000000000\n' \
#                                            > $DATA/genesis/wallets.txt
#   cp spec/audit/evidence/endo-spike/ws-node.conf $DATA/rnode.conf
#   target/debug/rnode run -d $DATA
#
# `run-ws.sh` does exactly that. `ocapn-identity-key` is written on first use, mode 0600, and the
# transcript's dialler reads it to learn the name it has to check the challenge against.

standalone = true
dev-mode = true
propose-on-deploy = true

protocol-server {
  host = "127.0.0.1"
  port = 40565
  no-upnp = true
}

api-server {
  host = "127.0.0.1"
  port-grpc-external = 40421
  port-grpc-internal = 40422
  port-http = 40423
  port-admin-http = 40425
  # The listener the transcript dials.
  ocapn-listen-websocket = "127.0.0.1:22060"
  # `ocapn-identity-key` is **not** set here: the node's identity is an Ed25519 seed and an X25519
  # static created on first use, and the runner passes its path on the command line
  # (`--ocapn-identity-key`) so this file holds no machine-specific path. The websocket challenge is
  # signed with the Ed25519 half, and a peer checks it against the key it dialled.
}

casper {
  validator-private-key = "a68a6e6cca30f81bd24a719f3145d20e8424bd7b396309b0708a16c7d8000b76"
}

dev {
  deployer-private-key = "a68a6e6cca30f81bd24a719f3145d20e8424bd7b396309b0708a16c7d8000b76"
}
